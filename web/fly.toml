app = "apix-dashboard"
primary_region = "sin"

[build]
  [build.args]
    NEXT_PUBLIC_API_BASE = "https://apix-api.fly.dev/api/v1"
    NEXT_PUBLIC_API_KEY = "demo-readonly-key"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
