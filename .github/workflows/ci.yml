name: CI
on:
  push:
    branches: [main, feat/api-web, feat/pipeline]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.lock.txt
      - run: pip install -r api/requirements.lock.txt
      - run: ruff check api/app api/tests
      - run: black --check api/app api/tests
      - run: pytest api/tests -q
        env:
          PYTHONPATH: api
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test Engineer A's pipeline when present
        shell: bash
        run: |
          if [ -f pipeline/pyproject.toml ]; then
            pip install -e './pipeline[test]' pytest
            pytest pipeline/tests -q
          else
            echo 'Pipeline has not been handed off. Serving-plane CI does not certify pipeline readiness.' >> "$GITHUB_STEP_SUMMARY"
            if [ "${GITHUB_REF}" = 'refs/heads/main' ]; then
              echo 'Main requires the pipeline before integration acceptance.'
              exit 1
            fi
          fi
