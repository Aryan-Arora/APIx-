[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apix"
version = "0.1.0"
description = "APIx — Real-time Airfare Price Index for India: data pipeline"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
    "click>=8.1",
    "numpy>=1.24",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
apix = "apix.pipeline:cli"

[tool.setuptools.packages.find]
include = ["apix*"]
